<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Fase 2 💕</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

:root {
  --pink:    #ff6b9d;
  --red:     #ff4757;
  --dark:    #0a0a14;
  --card-bg: #12121e;
  --border:  rgba(255,107,157,.18);
}

html, body { height:100%; }

body {
  background: var(--dark);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-family: 'Montserrat', sans-serif;
  overflow: hidden;
  position: relative;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 60% 50% at 20% 80%, rgba(255,71,87,.08), transparent 60%),
    radial-gradient(ellipse 50% 40% at 80% 20%, rgba(255,107,157,.06), transparent 60%);
  pointer-events: none;
}

#bg { position:fixed; inset:0; pointer-events:none; z-index:0; }

.container {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  padding: 24px 16px;
  width: 100%;
  max-width: 360px;
  animation: fadein .8s ease both;
}

@keyframes fadein {
  from { opacity:0; transform:translateY(20px); }
  to   { opacity:1; transform:translateY(0); }
}

.progress {
  font-size: 12px;
  color: rgba(255,107,157,.65);
  letter-spacing: .8px;
  font-weight: 500;
}

.card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 24px;
  padding: 32px 24px 28px;
  width: 100%;
  box-shadow:
    0 24px 64px rgba(0,0,0,.65),
    inset 0 1px 0 rgba(255,255,255,.05);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 18px;
}

.card-icon {
  font-size: 40px;
  animation: iconpop .6s cubic-bezier(.36,.07,.19,.97) both;
}

@keyframes iconpop {
  from { transform:scale(0); opacity:0; }
  to   { transform:scale(1); opacity:1; }
}

.card-title {
  font-family: 'Playfair Display', serif;
  font-style: italic;
  font-size: 20px;
  font-weight: 600;
  color: #fff;
  text-align: center;
  line-height: 1.3;
}

.card-sub {
  font-size: 13px;
  color: rgba(255,255,255,.4);
  text-align: center;
  font-weight: 300;
  letter-spacing: .3px;
  line-height: 1.5;
  margin-top: -8px;
}

.date-input-wrap {
  position: relative;
  width: 100%;
}

.date-input {
  background: rgba(255,255,255,.05);
  border: 1.5px solid rgba(255,107,157,.22);
  border-radius: 12px;
  padding: 14px 16px;
  color: #fff;
  font-family: 'Montserrat', sans-serif;
  font-size: 18px;
  letter-spacing: 2px;
  outline: none;
  transition: border-color .25s;
  -webkit-appearance: none;
  width: 100%;
  text-align: center;
}

.date-input:focus { border-color: rgba(255,107,157,.62); }

.date-placeholder {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  letter-spacing: 2px;
  color: rgba(255,255,255,.2);
  pointer-events: none;
  font-family: 'Montserrat', sans-serif;
  transition: opacity .2s;
}

.q-error {
  font-size: 12px;
  color: rgba(255,120,120,.82);
  text-align: center;
  min-height: 18px;
  width: 100%;
}

.btn-confirm {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 13px 34px;
  border-radius: 50px;
  border: 1.5px solid rgba(255,107,157,.45);
  background: transparent;
  color: var(--pink);
  font-family: 'Montserrat', sans-serif;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: color .25s, border-color .25s, box-shadow .25s, background .25s;
  -webkit-tap-highlight-color: transparent;
  outline: none;
  letter-spacing: .3px;
}

.btn-confirm:hover {
  color: #fff;
  border-color: var(--pink);
  box-shadow: 0 0 24px rgba(255,107,157,.25);
  background: rgba(255,107,157,.08);
}

.btn-confirm:active { transform: scale(.94); }

@keyframes cardshake {
  0%,100% { transform:translateX(0); }
  20%     { transform:translateX(-8px); }
  40%     { transform:translateX(8px); }
  60%     { transform:translateX(-5px); }
  80%     { transform:translateX(5px); }
}

.card.shake { animation: cardshake .38s ease; }

/* Falling hearts */
.falling-heart {
  position: fixed;
  top: -60px;
  font-size: 26px;
  pointer-events: none;
  z-index: 999;
  animation: fallheart 2s ease-in forwards;
}

@keyframes fallheart {
  0%   { top:-60px; opacity:1; }
  80%  { opacity:.8; }
  100% { top:110vh; opacity:0; }
}
</style>
</head>
<body>

<canvas id="bg"></canvas>

<div class="container" id="container">
  <div class="progress">💕 Fase 2 de 5</div>

  <div class="card" id="card">
    <div class="card-icon">📅</div>
    <h2 class="card-title">Uma data que mudou tudo...</h2>
    <p class="card-sub">Qual a data que mudou tudo?</p>

    <div class="date-input-wrap">
      <input type="text" class="date-input" id="dateInp"
             inputmode="numeric" maxlength="10"
             autocomplete="off" placeholder="DD/MM/AAAA">
    </div>

    <div class="q-error" id="dateErr"></div>

    <button class="btn-confirm" id="btnConfirm">Confirmar</button>
  </div>
</div>

<script>
// ─── Particles ─────────────────────────────────────────────────────────────
const canvas = document.getElementById('bg');
const ctx    = canvas.getContext('2d');
const CHARS  = ['♥','❤','✦','·','✿'];
const PCOLS  = ['#ff6b9d','#ff4757','#ff8fab','#ffb3c6','rgba(255,255,255,.7)'];
function resize(){ canvas.width=innerWidth; canvas.height=innerHeight; }
resize(); window.addEventListener('resize', resize);
const pts = Array.from({length:50},()=>({
  x:Math.random()*innerWidth, y:Math.random()*innerHeight,
  sz:Math.random()*12+5, vx:(Math.random()-.5)*.36,
  vy:-(Math.random()*.52+.18), a:Math.random()*.3+.07,
  ch:CHARS[Math.random()*CHARS.length|0], c:PCOLS[Math.random()*PCOLS.length|0]
}));
(function loop(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  for(const p of pts){
    ctx.save(); ctx.globalAlpha=p.a; ctx.fillStyle=p.c;
    ctx.font=p.sz+'px serif'; ctx.fillText(p.ch,p.x,p.y); ctx.restore();
    p.x+=p.vx; p.y+=p.vy;
    if(p.y<-16){ p.y=canvas.height+16; p.x=Math.random()*canvas.width; }
  }
  requestAnimationFrame(loop);
})();

// ─── Protection ────────────────────────────────────────────────────────────
if(!sessionStorage.getItem('f1ok')) location.href='fase1.html';

// ─── Date mask ─────────────────────────────────────────────────────────────
const dateInp = document.getElementById('dateInp');
let lastLen = 0;

dateInp.addEventListener('input', ()=>{
  let raw = dateInp.value.replace(/\D/g,'');
  let formatted = '';
  if(raw.length > 0) formatted  = raw.substring(0,2);
  if(raw.length > 2) formatted += '/' + raw.substring(2,4);
  if(raw.length > 4) formatted += '/' + raw.substring(4,8);
  dateInp.value = formatted;
});

dateInp.addEventListener('keydown', e=>{
  if(e.key==='Enter') document.getElementById('btnConfirm').click();
});

// ─── Validation ────────────────────────────────────────────────────────────
const card = document.getElementById('card');

function shakeCard(){
  card.classList.remove('shake');
  void card.offsetWidth;
  card.classList.add('shake');
  card.addEventListener('animationend',()=>card.classList.remove('shake'),{once:true});
}

function showErr(msg){
  document.getElementById('dateErr').textContent = msg;
  shakeCard();
  setTimeout(()=>{ document.getElementById('dateErr').textContent=''; },2200);
}

function goTo(url, key){
  const c = document.getElementById('container');
  c.style.transition = 'opacity .4s ease';
  c.style.opacity = '0';
  setTimeout(()=>{ if(key) sessionStorage.setItem(key,'1'); location.href=url; }, 420);
}

function launchHearts(){
  const emojis = ['❤','💕','💗','💖','💝','🌹','✨','💘'];
  for(let i=0; i<8; i++){
    const h = document.createElement('div');
    h.className = 'falling-heart';
    h.textContent = emojis[i];
    h.style.left = (8 + Math.random() * 84) + '%';
    h.style.animationDelay = (i * 0.18) + 's';
    h.style.fontSize = (20 + Math.random()*16) + 'px';
    document.body.appendChild(h);
    setTimeout(()=> h.remove(), 2500);
  }
}

document.getElementById('btnConfirm').addEventListener('click',()=>{
  const val = dateInp.value.trim();
  if(val.length < 10){ showErr('Digite a data completa: DD/MM/AAAA'); return; }
  if(val === '16/08/2026'){
    launchHearts();
    setTimeout(()=> goTo('fase3.html','f2ok'), 1200);
  } else {
    showErr('Essa não é a data certa, amor... pensa melhor 💭');
  }
});
</script>
</body>
</html>

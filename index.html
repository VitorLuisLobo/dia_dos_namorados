<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Vitor &amp; Gabi 💕</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --pink:    #ff6b9d;
  --red:     #ff4757;
  --dark:    #0a0a14;
  --card-bg: #12121e;
  --border:  rgba(255,107,157,.18);
}

html, body {
  height: 100%;
}

body {
  background: var(--dark);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-family: 'Montserrat', sans-serif;
  overflow: hidden;
  position: relative;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 60% 50% at 20% 80%, rgba(255,71,87,.08) 0%, transparent 60%),
    radial-gradient(ellipse 50% 40% at 80% 20%, rgba(255,107,157,.06) 0%, transparent 60%);
  pointer-events: none;
}

#bg {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
}

.container {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 28px;
  padding: 24px 16px;
  width: 100%;
  max-width: 360px;
  animation: fadein .8s ease both;
}

@keyframes fadein {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}

.player-card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 24px;
  padding: 24px 22px 22px;
  width: 100%;
  box-shadow:
    0 24px 64px rgba(0,0,0,.65),
    0 0 0 1px rgba(255,107,157,.04),
    inset 0 1px 0 rgba(255,255,255,.05);
}

.album-wrap {
  width: 100%;
  aspect-ratio: 1;
  border-radius: 16px;
  overflow: hidden;
  margin-bottom: 20px;
  position: relative;
  box-shadow: 0 8px 32px rgba(0,0,0,.55);
  transition: box-shadow .5s ease;
  background: linear-gradient(135deg, #1e1030, #2d1b69, #0f2027);
}

.album-wrap.playing {
  box-shadow:
    0 8px 40px rgba(255,107,157,.35),
    0 0 0 2px rgba(255,107,157,.2);
}

.album-cover {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.album-placeholder {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 72px;
  background: linear-gradient(135deg, #1e1030, #2d1b69, #0f2027);
}

.track-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
  gap: 12px;
}

.track-title {
  font-family: 'Playfair Display', serif;
  font-size: 20px;
  font-weight: 700;
  color: #fff;
  line-height: 1.2;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.track-sub {
  font-size: 12px;
  color: rgba(255,255,255,.4);
  margin-top: 4px;
  font-weight: 300;
  letter-spacing: .3px;
}

.eq {
  flex-shrink: 0;
  display: flex;
  align-items: flex-end;
  gap: 3px;
  height: 20px;
}

.eq-bar {
  width: 3px;
  border-radius: 2px;
  background: linear-gradient(to top, var(--red), var(--pink));
  height: 4px;
  transition: height .1s;
}

.eq.playing .eq-bar:nth-child(1) { animation: eq .55s ease-in-out infinite alternate; }
.eq.playing .eq-bar:nth-child(2) { animation: eq .75s ease-in-out infinite alternate .15s; }
.eq.playing .eq-bar:nth-child(3) { animation: eq .45s ease-in-out infinite alternate .08s; }
.eq.playing .eq-bar:nth-child(4) { animation: eq .65s ease-in-out infinite alternate .22s; }
.eq.playing .eq-bar:nth-child(5) { animation: eq .85s ease-in-out infinite alternate .05s; }

@keyframes eq {
  from { height: 4px; }
  to   { height: 20px; }
}

.progress-area {
  margin-bottom: 18px;
}

.progress-track {
  height: 4px;
  background: rgba(255,255,255,.08);
  border-radius: 2px;
  cursor: pointer;
  position: relative;
  overflow: visible;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--pink), var(--red));
  border-radius: 2px;
  width: 0%;
  transition: width .1s linear;
  position: relative;
}

.progress-thumb {
  position: absolute;
  right: -6px;
  top: -4px;
  width: 12px;
  height: 12px;
  background: #fff;
  border-radius: 50%;
  opacity: 0;
  transition: opacity .2s;
  box-shadow: 0 0 8px rgba(255,107,157,.9);
}

.progress-track:hover .progress-thumb { opacity: 1; }

.time-row {
  display: flex;
  justify-content: space-between;
  margin-top: 7px;
  font-size: 11px;
  color: rgba(255,255,255,.3);
  letter-spacing: .2px;
}

.controls-row {
  display: flex;
  align-items: center;
  justify-content: center;
}

.play-btn {
  width: 58px;
  height: 58px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--pink), var(--red));
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 22px rgba(255,71,87,.45);
  transition: transform .15s ease, box-shadow .15s ease;
  -webkit-tap-highlight-color: transparent;
  outline: none;
}

.play-btn:hover {
  transform: scale(1.08);
  box-shadow: 0 6px 28px rgba(255,71,87,.62);
}

.play-btn:active { transform: scale(.93); }

.play-btn svg {
  width: 23px;
  height: 23px;
  fill: #fff;
}

.btn-surprise {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  padding: 15px 38px;
  border-radius: 50px;
  border: 1.5px solid rgba(255,107,157,.45);
  color: var(--pink);
  font-family: 'Montserrat', sans-serif;
  font-size: 15px;
  font-weight: 600;
  text-decoration: none;
  letter-spacing: .3px;
  transition: all .3s ease;
  position: relative;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}

.btn-surprise::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at center, rgba(255,107,157,.12), transparent 70%);
  opacity: 0;
  transition: opacity .3s;
}

.btn-surprise:hover {
  color: #fff;
  border-color: var(--pink);
  box-shadow: 0 0 32px rgba(255,107,157,.28);
  transform: translateY(-2px);
}

.btn-surprise:hover::before { opacity: 1; }
.btn-surprise:active { transform: translateY(0); }

.btn-surprise .mail-icon {
  display: inline-block;
  animation: mail-pulse 2.2s ease infinite;
}

@keyframes mail-pulse {
  0%, 100% { transform: scale(1) rotate(0deg); }
  30%       { transform: scale(1.25) rotate(-6deg); }
  60%       { transform: scale(1.1)  rotate(4deg); }
}

@media (max-width: 360px) {
  .container    { max-width: 320px; padding: 16px 12px; }
  .player-card  { padding: 20px 18px 18px; }
  .track-title  { font-size: 18px; }
}
</style>
</head>
<body>

<canvas id="bg"></canvas>

<div class="container">
  <div class="player-card">

    <div class="album-wrap" id="albumWrap">
      <img src="assets/foto0.jpeg" alt="Vitor &amp; Gabi" class="album-cover" id="albumCover"
           onerror="this.style.display='none'">
      <div class="album-placeholder" id="albumPH" style="display:none">♥</div>
    </div>

    <div class="track-row">
      <div class="track-info">
        <div class="track-title">Vitor &amp; Gabi</div>
        <div class="track-sub">Te amo gatinha ♥</div>
      </div>
      <div class="eq" id="eq">
        <div class="eq-bar"></div>
        <div class="eq-bar"></div>
        <div class="eq-bar"></div>
        <div class="eq-bar"></div>
        <div class="eq-bar"></div>
      </div>
    </div>

    <div class="progress-area">
      <div class="progress-track" id="progressTrack">
        <div class="progress-fill" id="progressFill">
          <div class="progress-thumb"></div>
        </div>
      </div>
      <div class="time-row">
        <span id="currentTime">0:00</span>
        <span id="totalTime">0:50</span>
      </div>
    </div>

    <div class="controls-row">
      <button class="play-btn" id="playBtn" onclick="togglePlay()" aria-label="Play/Pause">
        <svg id="iconPlay"  viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <svg id="iconPause" viewBox="0 0 24 24" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </button>
    </div>

    <audio id="audio" src="assets/Michael Jackson - Don't Stop 'Til You Get Enough (Official Video - Upscaled) - michaeljacksonVEVO (youtube).mp3" preload="metadata"></audio>
  </div>

  <a href="surprise.html" class="btn-surprise">
    <span class="mail-icon">💌</span>
    Veja a surpresa
  </a>
</div>

<script>
// ─── Phase protection ─────────────────────────────────────────────────────
if(!sessionStorage.getItem('f5ok')) location.href='fase1.html';

// ─── Trecho de áudio: 2:10 (130s) até 3:00 (180s) ────────────────────────
const START_TIME  = 130; // 2:10
const END_TIME    = 180; // 3:00
const CLIP_DURATION = END_TIME - START_TIME; // 50s

// ─── Particles ────────────────────────────────────────────────────────────
const canvas = document.getElementById('bg');
const ctx    = canvas.getContext('2d');
const CHARS  = ['♥','❤','✦','·','✿'];
const PCOLS  = ['#ff6b9d','#ff4757','#ff8fab','#ffb3c6','rgba(255,255,255,.7)'];

function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }
resize();
window.addEventListener('resize', resize);

const particles = Array.from({length: 55}, () => ({
  x:    Math.random() * innerWidth,
  y:    Math.random() * innerHeight,
  size: Math.random() * 13 + 5,
  vx:   (Math.random() - .5) * .38,
  vy:   -(Math.random() * .55 + .18),
  a:    Math.random() * .32 + .07,
  ch:   CHARS[Math.random() * CHARS.length | 0],
  col:  PCOLS[Math.random() * PCOLS.length | 0],
}));

(function loopP() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  for (const p of particles) {
    ctx.save();
    ctx.globalAlpha = p.a;
    ctx.fillStyle   = p.col;
    ctx.font        = p.size + 'px serif';
    ctx.fillText(p.ch, p.x, p.y);
    ctx.restore();
    p.x += p.vx; p.y += p.vy;
    if (p.y < -16) { p.y = canvas.height + 16; p.x = Math.random() * canvas.width; }
  }
  requestAnimationFrame(loopP);
})();

// ─── Audio Player ─────────────────────────────────────────────────────────
const audio         = document.getElementById('audio');
const iconPlay      = document.getElementById('iconPlay');
const iconPause     = document.getElementById('iconPause');
const progressFill  = document.getElementById('progressFill');
const progressTrack = document.getElementById('progressTrack');
const curTimeEl     = document.getElementById('currentTime');
const totTimeEl     = document.getElementById('totalTime');
const eq            = document.getElementById('eq');
const albumWrap     = document.getElementById('albumWrap');
const albumCover    = document.getElementById('albumCover');
const albumPH       = document.getElementById('albumPH');

albumCover.addEventListener('error', () => {
  albumCover.style.display = 'none';
  albumPH.style.display    = 'flex';
});

let playing = false;

// Ao carregar metadados, fixa o totalTime e posiciona no início do trecho
audio.addEventListener('loadedmetadata', () => {
  totTimeEl.textContent = fmt(CLIP_DURATION); // mostra 0:50
  audio.currentTime = START_TIME;
});

function togglePlay() {
  if (playing) {
    audio.pause();
  } else {
    // Garante que começa no ponto certo se estiver fora do trecho
    if (audio.currentTime < START_TIME || audio.currentTime >= END_TIME) {
      audio.currentTime = START_TIME;
    }
    audio.play().catch(() => {});
  }
}

audio.addEventListener('play', () => {
  playing = true;
  iconPlay.style.display  = 'none';
  iconPause.style.display = 'block';
  eq.classList.add('playing');
  albumWrap.classList.add('playing');
});

audio.addEventListener('pause', () => {
  playing = false;
  iconPlay.style.display  = 'block';
  iconPause.style.display = 'none';
  eq.classList.remove('playing');
  albumWrap.classList.remove('playing');
});

audio.addEventListener('timeupdate', () => {
  // Para ao atingir END_TIME
  if (audio.currentTime >= END_TIME) {
    audio.pause();
    audio.currentTime = START_TIME;
    progressFill.style.width = '0%';
    curTimeEl.textContent    = '0:00';
    return;
  }

  // Calcula progresso relativo ao trecho
  const elapsed = audio.currentTime - START_TIME;
  const pct     = (elapsed / CLIP_DURATION) * 100;
  progressFill.style.width = pct + '%';
  curTimeEl.textContent    = fmt(elapsed);
});

// Clique na barra de progresso — mapeia para o trecho
progressTrack.addEventListener('click', e => {
  const r   = progressTrack.getBoundingClientRect();
  const pct = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
  audio.currentTime = START_TIME + pct * CLIP_DURATION;
});

progressTrack.addEventListener('touchend', e => {
  const r   = progressTrack.getBoundingClientRect();
  const pct = Math.max(0, Math.min(1, (e.changedTouches[0].clientX - r.left) / r.width));
  audio.currentTime = START_TIME + pct * CLIP_DURATION;
}, { passive: true });

function fmt(s) {
  s = Math.max(0, Math.floor(s));
  const m = Math.floor(s / 60);
  return m + ':' + String(s % 60).padStart(2, '0');
}
</script>
</body>
</html>
